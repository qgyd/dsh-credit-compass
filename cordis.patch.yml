# Bundle patch for dsh-credit-compass, applied after the base and web-app layers.
# One row: the Host half, which contributes no service of its own -- the credit
# figure comes from the WorkBuddy usage route and the cell is the browser half.
# The row exists so `dsh-client-modules` has a Loader row to attach that half to
# (it attaches a package's `dsh.client` declaration to the row whose specifier is
# the bare package name).
- insert:
    - id: credit-compass
      name: dsh-credit-compass
